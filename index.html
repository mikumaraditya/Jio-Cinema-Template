<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      JioCinema - Watch Sports, Movies, Web Series, TV Online in HD Quality
    </title>
    <link rel="icon" href="https://www.jiocinema.com/favicon.ico" />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar">
      <div class="navbar-part1">
        <div class="logo-div">
          <img
            src="https://www.jiocinema.com/images/jc_logo_v2.svg"
            alt="jiocinemalogo"
            id="jiocinemalogo"
          />
        </div>
        <div class="icon">Home</div>
        <div class="icon">Sports</div>
        <div class="icon">Movies</div>
        <div class="icon">TV Shows</div>
        <div class="icon">More</div>
        <div class="icon" id="stat-minus">
          <span class="material-symbols-outlined">stat_minus_1</span>
        </div>
      </div>
      <div class="navbar-part2">
        <div class="icon2" id="search-icon">
          <span class="material-symbols-outlined">search</span>
        </div>
        <div class="icon2">
          <input
            type="text"
            placeholder="Movies, Shows and more"
            id="search-box"
          />
        </div>
        <div class="icon2">
          <img
            src="https://www.jiocinema.com/images/profile/avatar_guest.svg"
            alt="avatar_guest"
            id="avatar_guest"
          />
        </div>
      </div>
    </nav>
    <hr />
    <section>
      <div class="image">
        <img
          src="https://v3img.voot.com/resizeMedium,w_914,h_514/v3Storage/assets/pokemon-1707725560430.jpg"
          alt="pokemon"
          id="cartoon"
        />
      </div>
      <div class="image">
        <img
          src="https://v3img.voot.com/resizeMedium,w_914,h_514/v3Storage/assets/top_10_yorkers_clean_ctv-1706622638062.jpg"
          alt="cricket"
          id="cricket"
        />
      </div>
      <div class="image">
        <img
          src="https://v3img.voot.com/resizeMedium,w_914,h_514/v3Storage/assets/vertical-carousel-tv_50shades-1727778969348.jpg"
          alt="web series"
          id="tvshow"
        />
      </div>
    </section>

    <hr />

    <footer>
      <div class="footer">
        <div class="footer1">
          <div>
            <div id="highlight">Jio Cinema</div>
            <div>For You</div>
            <div>Sports</div>
            <div>Movies</div>
            <div>TV Shows</div>
          </div>
          <div>
            <div id="highlight">Support</div>
            <div>Help Center</div>
            <div>Terms Of Use</div>
            <div>Privacy Policy</div>
            <div>Content Complaints</div>
          </div>
        </div>
        <div class="footer2">
          <div class="social-media-icons">
            <div>Connect With Us</div>
          <div id="outter-div-media">
            <div
              id="media-icons"><img
                src="https://www.jiocinema.com/images/facebook.svg"
                alt="facebook-icon"
            /></div>
            <div
              id="media-icons"><img
                src="https://www.jiocinema.com/images/x.svg"
                alt="twitter-icon"
            /></div>
            <div
              id="media-icons"><img
                src="https://www.jiocinema.com/images/instagram.svg"
                alt="instagram-icon"
            /></div>
            <div
              id="media-icons"><img
                src="https://www.jiocinema.com/images/youtube.svg"
                alt="youtube-icon"
            /></div>
          </div>
          </div>

          <div id="outter-div-playstore">
            <div id="download-app">Download the App</div>
            <div id="play-store">
              <span
                ><img
                  src="https://www.jiocinema.com/images/googlePlay.svg"
                  alt="googlePlay-icon"
              /></span>
              <span
                ><img
                  src="https://www.jiocinema.com/images/appleStore.svg"
                  alt="jiocinema-icon"
              /></span>
            </div>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
